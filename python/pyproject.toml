[project]
name = "specx"
version = "0.1.0"
description = "SpecX — safety ML (S6/S1/S2), optimisation (F2/S4), evaluation (F4) and stats."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "jsonschema[format-nongpl]>=4.23",
  "numpy>=1.26",
  "pandas>=2.2",
  "tabulate>=0.9",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "typer>=0.12",
  "rich>=13.9",
  "playwright>=1.50",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "gymnasium>=1.0",
  "stable-baselines3>=2.4",
  "torch-geometric>=2.6",
  "networkx>=3.3",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sandbox: needs the sandbox server on :4000 and seed apps running",
  "llm: makes real Anthropic API calls (costs money)",
  "slow: > 60 s",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specx"]
